<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F4F7">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>디자이너 트렌드 레이더</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:"Pretendard Variable";src:url("fonts/PretendardVariable-subset.woff2") format("woff2-variations"),url("fonts/PretendardVariable-subset.woff2") format("woff2");font-weight:45 920;font-style:normal;font-display:swap}
/* Layout: iOS grouped-inset lists under a large title, one accent (system blue), hairline separators, a translucent bottom tab bar. */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --fill:#E5E5EA; --fill-2:#D1D1D6;
  --fg:#000000; --fg-2:#6E6E73; --fg-3:#AEAEB2; --line:rgba(60,60,67,.18);
  --accent:#007AFF; --accent-fg:#FFFFFF; --accent-soft:rgba(0,122,255,.12);
  --seg-bg:rgba(118,118,128,.12); --seg-sel:#FFFFFF; --tab-bg:rgba(249,249,249,.86);
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --tab-h:50px; --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#000000; --surface:#1C1C1E; --fill:#2C2C2E; --fill-2:#3A3A3C;
  --fg:#FFFFFF; --fg-2:#8E8E93; --fg-3:#636366; --line:rgba(84,84,88,.6);
  --accent:#0A84FF; --accent-fg:#FFFFFF; --accent-soft:rgba(10,132,255,.18);
  --seg-bg:rgba(118,118,128,.24); --seg-sel:#636366; --tab-bg:rgba(22,22,24,.86);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --fill:#2C2C2E; --fill-2:#3A3A3C;
  --fg:#FFFFFF; --fg-2:#8E8E93; --fg-3:#636366; --line:rgba(84,84,88,.6);
  --accent:#0A84FF; --accent-fg:#FFFFFF; --accent-soft:rgba(10,132,255,.18);
  --seg-bg:rgba(118,118,128,.24); --seg-sel:#636366; --tab-bg:rgba(22,22,24,.86);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--accent);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-appearance:none}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.35}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

.app{min-height:100%;padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 28px)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}

/* large-title header */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg)}
.topbar .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:14px 8px}
.topbar h1{font-size:30px;font-weight:700;letter-spacing:-.02em}
.topbar .sub{font-size:13px;color:var(--fg-2);margin-top:2px}
.tools{display:flex;gap:8px;padding-bottom:4px}
.icon-btn{width:36px;height:36px;border-radius:50%;background:var(--fill);display:inline-flex;align-items:center;justify-content:center;color:var(--accent)}
.icon-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:disabled{color:var(--fg-3);cursor:default}
.icon-btn.spin svg{animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.view{display:none}
.view.active{display:block}
.group{margin-top:22px}
.group-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 4px 7px}
.group-h h2{font-size:13px;font-weight:600;color:var(--fg-2);letter-spacing:.01em}
.group-h .more{font-size:14px;color:var(--accent);font-weight:400}
.group-h .meta{font-size:12px;color:var(--fg-3)}
.list{background:var(--surface);border-radius:var(--r);overflow:hidden}
.list > * + *{border-top:1px solid var(--line)}
.card{background:var(--surface);border-radius:var(--r);padding:14px 16px}
.foot{font-size:12.5px;color:var(--fg-3);padding:10px 4px 0;line-height:1.6}
.foot a{color:var(--fg-2)}

/* briefing (What's New style) */
.brief{background:var(--surface);border-radius:var(--r);padding:18px 16px 14px}
.brief .week{font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.02em}
.brief h2{font-size:22px;font-weight:700;letter-spacing:-.015em;margin-top:4px}
.brief .rows{display:grid;gap:14px;margin-top:16px}
.brow{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start}
.brow .ic{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.brow .ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.brow .t{font-size:15px;font-weight:600;line-height:1.4}
.brow .d{font-size:14px;color:var(--fg-2);line-height:1.55;margin-top:2px}
.brief .next{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--fg-2)}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.tile{background:var(--surface);border-radius:var(--r);padding:11px 12px;min-width:0}
.tile .k{font-size:11.5px;color:var(--fg-2);line-height:1.3}
.tile .v{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-top:3px}
.tile .v small{font-size:11px;color:var(--fg-2);font-weight:500;margin-left:2px}

/* status banner for refresh */
.banner{background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;margin-top:12px}
.banner[hidden]{display:none}
.banner .ic{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.banner .ic svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.banner .ic.spin svg{animation:spin 1.1s linear infinite}
.banner .tx{flex:1;min-width:0}
.banner .t{font-size:14px;font-weight:600}
.banner .d{font-size:13px;color:var(--fg-2)}
.banner .x{color:var(--fg-3);font-size:18px;padding:4px}
.progress{height:3px;background:var(--fill);border-radius:2px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;width:35%;background:var(--accent);border-radius:2px;animation:slide 1.6s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}

/* chips + segmented */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--fill);color:var(--fg);font-size:14px;font-weight:500;padding:7px 14px;border-radius:999px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--seg-bg);border-radius:9px;padding:2px;margin:4px 0 0}
.seg button{padding:7px 10px;border-radius:7px;font-size:13.5px;font-weight:500;color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--seg-sel);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.04)}

/* news row */
.news{padding:14px 16px;display:grid;gap:8px;background:var(--surface)}
.news .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.news .tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--fill);color:var(--fg-2)}
.tag.new{background:var(--accent);color:var(--accent-fg)}
.news .date{font-size:12px;color:var(--fg-3)}
.news h3{font-size:16px;font-weight:600;letter-spacing:-.01em}
.news .sum{font-size:14.5px;color:var(--fg-2);line-height:1.65}
.news .why{font-size:14px;line-height:1.6;padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--fg)}
.news .why b{font-weight:600;color:var(--accent)}
.news .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:600;padding:7px 13px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.btn.plain{background:var(--fill);color:var(--fg)}
.btn.link{background:transparent;padding-left:2px;padding-right:2px;font-weight:500}
.btn.link small{color:var(--fg-3);font-weight:400;font-size:12px}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.btn:disabled{opacity:.5;cursor:default}
.explain{font-size:14.5px;line-height:1.7;background:var(--fill);border-radius:10px;padding:10px 12px;white-space:pre-wrap}
.explain .lbl{font-size:11px;font-weight:600;color:var(--fg-2);display:block;margin-bottom:4px;letter-spacing:.04em}

/* jobs */
.jd summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:16px}
.jd summary::-webkit-details-marker{display:none}
.jd summary::after{content:"펼치기";font-size:14px;color:var(--accent);font-weight:400}
.jd[open] summary::after{content:"접기"}
.jd .note{font-size:13.5px;color:var(--fg-2);margin-top:8px;line-height:1.65}
.jd .kv{display:grid;grid-template-columns:68px 1fr;gap:8px 12px;font-size:14px;margin:12px 0 0}
.jd .kv dt{color:var(--fg-2);font-size:13px;padding-top:1px}
.jd .kv dd{margin:0;min-width:0}
.jd .kv ul{margin:0;padding-left:16px;display:grid;gap:5px;line-height:1.55}
.role{padding:14px 16px;display:grid;gap:6px;background:var(--surface)}
.role .row{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.role h3{font-size:16px;font-weight:600;letter-spacing:-.01em}
.dir{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;flex:0 0 auto}
.dir.up{background:var(--accent-soft);color:var(--accent)}
.dir.down{background:var(--fill);color:var(--fg-2)}
.dir.hold{background:transparent;color:var(--fg-3);border:1px solid var(--line)}
.role p{font-size:14.5px;color:var(--fg-2);line-height:1.65}
.role .fit{font-size:13px;color:var(--fg-2);line-height:1.6}
.role .fit b{color:var(--fg);font-weight:600}
.role .src{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}
.posting{padding:13px 16px;display:grid;gap:3px;background:var(--surface)}
.posting .co{font-size:12px;color:var(--fg-2);font-weight:500}
.posting .t{font-weight:600;font-size:15.5px}
.posting .d{font-size:14px;color:var(--fg-2)}
.posting a{font-size:13.5px;margin-top:2px}
.skill{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 16px;background:var(--surface)}
.skill .n{font-weight:600;font-size:15px}
.skill .d{font-size:13.5px;color:var(--fg-2);margin-top:2px;line-height:1.55}
.skill .pct{font-size:13px;font-weight:600;text-align:right}
.bar{height:5px;border-radius:3px;background:var(--fill);width:80px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.summary{font-size:15px;line-height:1.7}
.eyebrow{font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.02em}

.empty{padding:30px 16px;text-align:center;color:var(--fg-2);font-size:14.5px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--tab-bg);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);padding:0 max(8px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-right,0px))}
.tabbar .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tab-h)}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--fg-2);font-size:10px;font-weight:500}
.tabbar button[aria-selected="true"]{color:var(--accent)}
.tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-selected="true"] svg{stroke-width:2.1}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 16px);background:var(--fg);color:var(--bg);font-size:13.5px;font-weight:500;padding:9px 16px;border-radius:999px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}.icon-btn.spin svg,.banner .ic.spin svg,.progress i{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar"><div class="wrap">
    <div><h1>트렌드 레이더</h1><div class="sub num" id="hdrDate"></div></div>
    <div class="tools">
      <button class="icon-btn" id="themeBtn" aria-label="화면 모드 바꾸기" title="화면 모드"><svg viewBox="0 0 24 24" id="themeIc"></svg></button>
      <button class="icon-btn" id="refreshBtn" aria-label="새 소식 가져오기" title="새 소식 가져오기" hidden><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg></button>
    </div>
  </div></header>

  <main class="wrap">
    <section class="view active" id="view-home" data-view="home">
      <div class="banner" id="banner" hidden></div>
      <div class="brief" id="brief" style="margin-top:12px"></div>
      <div class="tiles" id="tiles"></div>
      <div class="group">
        <div class="group-h"><h2>직무 트렌드</h2><button class="more" data-go="jobs">자세히</button></div>
        <div class="list" id="homeJobs"></div>
      </div>
      <div class="group">
        <div class="group-h"><h2>이번 주 꼭 볼 이슈</h2><button class="more" data-go="news">전체 보기</button></div>
        <div class="list" id="homeNews"></div>
      </div>
      <p class="foot" id="homeNote"></p>
    </section>

    <section class="view" id="view-jobs" data-view="jobs">
      <div class="seg" role="tablist" aria-label="지역">
        <button role="tab" data-region="kr" aria-pressed="true">국내</button>
        <button role="tab" data-region="global" aria-pressed="false">해외</button>
      </div>
      <div id="jobsKr">
        <div class="group"><div class="group-h"><h2>기준점</h2></div><details class="card jd" id="jdCard"></details></div>
        <div class="group"><div class="group-h"><h2>늘어나는 직무</h2><span class="meta">NHN JD 대비 적합도</span></div><div class="list" id="krUp"></div></div>
        <div class="group"><div class="group-h"><h2>줄어들거나 합쳐지는 직무</h2></div><div class="list" id="krDown"></div></div>
        <div class="group"><div class="group-h"><h2>실제 공고 예시</h2><span class="meta">2025–2026</span></div><div class="list" id="krPostings"></div></div>
      </div>
      <div id="jobsGlobal" hidden>
        <div class="chips" id="countryChips" style="margin-top:12px"></div>
        <div id="globalBody"></div>
      </div>
      <div class="group"><div class="group-h"><h2>JD가 요구하는 스킬 변화</h2><span class="meta" id="skillMeta"></span></div><div class="list" id="skills"></div></div>
      <p class="foot" id="jobsNote"></p>
    </section>

    <section class="view" id="view-news" data-view="news">
      <div class="chips" id="newsChips" style="margin-top:6px"></div>
      <div class="group" style="margin-top:8px"><div class="list" id="newsList"></div></div>
      <p class="foot">「쉽게 설명」은 이 항목의 내용만 바탕으로 Claude가 더 풀어서 설명합니다. 처음 한 번 허용 확인이 뜹니다.</p>
    </section>

    <section class="view" id="view-saved" data-view="saved">
      <div class="group" style="margin-top:8px"><div class="group-h"><h2>저장한 항목</h2><span class="meta" id="savedMeta"></span></div><div class="list" id="savedList"></div></div>
      <p class="foot">저장 목록은 이 기기의 브라우저에만 남습니다.</p>
    </section>
  </main>

  <nav class="tabbar" aria-label="주요 메뉴"><div class="in">
    <button data-tab="home" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/></svg>홈</button>
    <button data-tab="jobs" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18"/></svg>직무</button>
    <button data-tab="news" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 5h13v14H6a2 2 0 0 1-2-2z"/><path d="M17 9h3v8a2 2 0 0 1-2 2"/><path d="M7 9h7M7 12h7M7 15h4"/></svg>이슈</button>
    <button data-tab="saved" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></svg>저장</button>
  </div></nav>

ude-haiku-55","date":"2026-10-07","tags":["ai"],"title":"Claude Haiku 5.5 출시, API 가격 90% 인하","summary":"Anthropic이 약 1년 만에 소형 모델 Haiku 5.5를 내놨습니다. 백만 토큰당 입력 $0.10, 출력 $0.50으로 GPT-6 Luna와 같은 가격이며 1M 컨텍스트와 이미지 입력을 지원합니다. Sonnet 5.5의 캐시 읽기 가격도 절반으로 내렸습니다.","why":"프로토타입에 AI 기능을 붙일 때 비용 장벽이 크게 낮아졌습니다. ‘AI가 들어간 UX’를 실험하기 쉬워졌습니다.","url":"https://platform.claude.com/docs/en/release-notes/overview"},{"id":"claude-duet","date":"2026-10-21","tags":["ai","big"],"title":"Claude Duet: 매일 아침 먼저 브리핑하는 ‘능동형 에이전트’ 프리뷰","summary":"Anthropic이 Opus 5.5 기반의 Claude Duet를 리서치 프리뷰로 공개했습니다. 연결된 Gmail·Slack 등을 몇 시간마다 확인해 주의가 필요한 일을 알리고, 메시지 전송·결제·삭제 같은 민감 작업은 승인을 먼저 요청합니다. 미국 Pro/Max 대기열 방식입니다.","why":"OpenAI Dots, Meta Muse와 함께 ‘사용자가 묻기 전에 움직이는 에이전트’의 알림·승인 UX가 핵심 설계 과제로 떠올랐습니다.","url":"https://www.macrumors.com/2026/10/21/anthropic-claude-duet/"},{"id":"meta-muse-wonder","date":"2026-10-15","tags":["ai","big"],"title":"Meta, Muse Wonder 공개. 오픈소스 Llama 시대는 사실상 종료","summary":"Meta Superintelligence Labs가 에이전트 작업에 특화한 최상위 모델 Muse Wonder를 발표했습니다. Llama는 더 이상 새 버전이 나오지 않고 Meta의 주력은 폐쇄형 Muse 라인으로 옮겨갔습니다. 온디바이스용 오픈 모델 Muse Glimmer만 가중치가 공개됩니다.","why":"Meta AI 앱과 Charm 기기 등 Meta 제품 경험이 Muse 중심으로 재편됩니다. 발표일은 출처 간 차이가 있어 10월 중순으로만 표기했습니다.","url":"https://about.fb.com/news/2026/10/introducing-muse-wonder-models/"},{"id":"mistral-large-4","date":"2026-10-06","tags":["ai"],"rumor":true,"title":"Mistral Large 4, 1조 파라미터 모델 프리뷰. 오픈 가중치는 ‘10월 말 예정’","summary":"유럽 Mistral이 총 1조 파라미터(활성 약 50B) MoE 모델을 API와 Mistral Studio에서 프리뷰로 공개했습니다. 텍스트·이미지 입력과 160개 이상 언어를 지원합니다. 오픈 가중치 공개는 예고만 됐고 아직 미공개입니다.","why":"유럽 데이터 주권을 요구하는 글로벌 프로젝트에서 선택지가 늘어납니다.","url":"https://techcrunch.com/2026/10/06/mistrals-new-1t-model-aims-to-leapfrog-closed-and-open-rivals/"},{"id":"deepseek-v41-flash","date":"2026-10-17","tags":["ai","gh"],"title":"DeepSeek V4.1-Flash 업데이트, MIT 라이선스로 공개","summary":"DeepSeek가 9월 출시한 V4.1 Flash의 개선판을 내놨습니다. 자체 테스트 기준 코딩 과제 해결률이 74.2%에서 77%로 올랐고 이미지 입력이 추가됐습니다. Hugging Face에 MIT 라이선스로 공개됐고 API 가격은 그대로입니다.","why":"무료·오픈 모델의 에이전트 성능이 빠르게 따라붙어, 사내 도구에 저비용 AI를 넣는 문턱이 더 낮아졌습니다.","url":"https://siliconangle.com/2026/10/18/deepseek-releases-updated-v4-1-flash-model-it-says-completes-tasks-faster/"},{"id":"kakao-everyones-ai","date":"2026-10-14","tags":["kr","ai"],"pick":true,"title":"카카오 ‘모두의 AI’ 연내 정식 출시. 카나나+엑사원 연합, MAU 500만 목표","summary":"카카오가 if(kakao)26에서 전 국민 대상 AI 서비스 ‘모두의 AI’를 연내 정식 출시한다고 밝혔습니다. 카카오톡과 웹에서 검색·조회·예약 같은 실제 과업 수행까지 연결하며, 카나나와 LG 엑사원 등 국산 모델에 PlayMCP의 검증된 도구를 붙입니다. 34개 기업·기관 컨소시엄이고 내년에는 ‘1인 1에이전트’를 단계 도입합니다.","why":"국내 1위 메신저 안에 과업 수행형 에이전트가 들어옵니다. 우리 서비스의 예약·결제 플로우가 카카오톡 에이전트와 연동되는 상황을 대비해야 합니다. 카카오 ‘AI 서비스 UI 디자이너’ 공고가 바로 이 제품을 만듭니다.","url":"https://www.etnews.com/20261014000242"},{"id":"kr-foundation-model-eval","date":"2026-08-27","tags":["kr","ai"],"title":"독자 AI 파운데이션 모델 2차 평가: SKT 1위, 업스테이지·LG AI연구원 뒤이어","summary":"과기정통부 2차 단계 평가에서 SK텔레콤이 종합 1위, 업스테이지와 LG AI연구원이 뒤를 이었습니다. 10월 중 새 평가 결과나 네이버·업스테이지·LG의 신규 모델 발표는 확인되지 않았습니다.","why":"국내 공공·대기업 프로젝트에서 어떤 국산 모델을 기본으로 쓰게 될지 가늠하는 지표입니다.","url":"https://www.newspim.com/news/view/20260827001289"},{"id":"figma-specs","date":"2026-10-14","tags":["tool"],"pick":true,"title":"Figma Specs 공개: 디자인 규칙을 Markdown으로 써서 AI 에이전트가 따르게 한다","summary":"Figma가 첫 인도 Config에서 ‘Figma Specs’를 발표했습니다. 디자인 언어와 규칙을 Markdown으로 적어 디자이너와 AI 에이전트가 함께 참조하는 문서로, 라이브러리 오너가 ‘빨강은 파괴적 액션에만’ 같은 가이드라인을 올리면 에이전트가 따르도록 유도합니다. Code Layers는 공개 베타로 전환됐고 MCP 연동 도구가 20개 이상 늘었습니다.","why":"디자인 시스템 문서가 ‘사람이 읽는 문서’에서 ‘AI가 실행하는 규칙’으로 바뀌는 전환점입니다. 디자인 시스템을 담당한다면 규칙을 Markdown으로 정리하는 습관이 필요합니다. Figma는 ‘보장이 아니라 예측 가능성 향상’이라고 선을 그었습니다.","url":"https://dataconomy.com/2026/10/15/figma-launches-specs-to-guide-ai-with-design-rules/"},{"id":"figma-agent-ga","date":"2026-10-06","tags":["tool"],"title":"Figma 에이전트 정식 출시. 이제 Make와 같은 AI 크레딧을 소모","summary":"Figma Design과 Weave의 에이전트가 베타를 끝내고 정식 출시되면서 Figma Make와 같은 AI 크레딧 풀을 씁니다. 파일·이미지·PDF·스프레드시트·코드를 프롬프트에 첨부하는 기능과, Make의 GitHub/npm 코드 가져오기(클로즈드 베타), Payload CMS 백엔드 자동 생성도 추가됐습니다.","why":"플랜별 월 크레딧이 팀 단위로 공유되므로 AI 사용량 관리가 실무 이슈가 됩니다.","url":"https://www.figma.com/blog/the-figma-agent-is-here/"},{"id":"cursor-october","date":"2026-10-16","tags":["tool"],"title":"Cursor 10월 업데이트: 클라우드 에이전트용 인터랙티브 캔버스, iOS 원격 제어","summary":"Cursor가 iOS 앱 Remote Control(10.6), 20개 이상 개발 도구 연동(10.13), 클라우드 에이전트의 인터랙티브 캔버스와 최대 300개 저장소 지원(10.16)을 연달아 내놨습니다. 출처는 릴리스노트 집계 사이트입니다.","why":"코딩 에이전트의 작업 결과를 ‘캔버스’로 보는 UI가 늘고 있어, 디자이너가 에이전트와 협업하는 방식이 Figma와 비슷해집니다.","url":"https://releasebot.io/updates/cursor"},{"id":"lovable-growth","date":"2026-10-20","tags":["tool"],"title":"Lovable, 앱을 만든 뒤 마케팅 캠페인 실행까지. 엔터프라이즈에는 EU 라우팅·감사 로그","summary":"바이브 코딩 도구 Lovable이 앱을 만든 뒤 검색·YouTube·지도·광고·SNS에 걸친 성장 계획을 세우고 실행을 돕는 기능을 추가했습니다. 엔터프라이즈에는 고객 AWS 계정 내 실행, EU 엔드포인트, 조직 정책, 감사 로그가 들어갔습니다. v0·Framer·Canva는 10월 중 뚜렷한 신기능이 확인되지 않았습니다.","why":"프로토타입 도구가 ‘만들기’를 넘어 ‘배포·성장’까지 묶으면서, 디자이너 1인이 MVP를 끝까지 끌고 가는 흐름이 강해집니다.","url":"https://lovable.dev/blog"},{"id":"adobe-max-2026","date":"2026-11-10","tags":["tool"],"rumor":true,"title":"Adobe MAX 2026은 11월 10~12일 마이애미. AI 트랙만 25개 세션","summary":"올해 MAX는 10월이 아닌 11월 10~12일에 열립니다. 세션 목록은 공개됐고 Firefly 중심 발표가 예상되지만 공식 발표 내용은 아직 없습니다. 10월에는 Firefly 비디오 에디터 배경 제거(베타) 정도가 나왔습니다.","why":"Photoshop·Illustrator의 에이전트 기능과 Firefly 모델 업데이트는 11월 둘째 주에 몰릴 예정입니다.","url":"https://blog.adobe.com/en/publish/2026/09/21/your-guide-to-the-ai-sessions-at-adobe-max-2026"},{"id":"ios27-liquid-glass","date":"2026-09-28","tags":["tool","big"],"title":"iOS 27, Liquid Glass에 ‘투명도 슬라이더’ 추가해 가독성 비판 수용","summary":"9월 배포된 iOS 27은 iOS 26 Liquid Glass의 가독성 논란에 대응해 설정에 ‘투명(Clear)~틴트(Tinted)’ 슬라이더를 넣고 유리 뒤 콘텐츠 가독성을 높였습니다. Liquid Glass로 빌드된 앱은 재컴파일 없이 대부분 자동 반영됩니다.","why":"사용자가 투명도를 직접 조절하므로, iOS 앱은 양극단 설정 모두에서 대비와 가독성이 확보되는지 점검해야 합니다.","url":"https://www.macrumors.com/2026/06/10/how-liquid-glass-is-changing-in-ios-27/"},{"id":"agentic-ux-trend","date":"2026-10-22","tags":["tool","ai"],"title":"트렌드: ‘생성형 UI·에이전틱 UX’가 기본값이 되는 중","summary":"GPT-6의 Intelligent UI, Gemini 앱의 Dynamic View, Claude Duet, OpenAI Dots 같은 능동형 에이전트가 한 달 사이 모두 대중 서비스로 나왔습니다. 디자인 커뮤니티에서는 ‘사용자가 검색하지 않고 위임한다’, ‘에이전트는 계획을 먼저 보여주고 중요한 일은 묻는다’가 2026년 설계 원칙으로 정리되고 있습니다.","why":"고정 화면 대신 ‘모델이 조합하는 컴포넌트 규칙’과 ‘승인·중단·되돌리기 패턴’을 디자인 시스템에 포함해야 합니다.","url":"https://blog.google/innovation-and-ai/products/gemini-app/next-evolution-gemini-app/"},{"id":"gh-openclaw-hermes","date":"2026-10-23","tags":["gh","ai"],"title":"깃허브 양강: OpenClaw 39만★, Hermes Agent 25만★. ‘개인 AI 비서 하네스’ 경쟁","summary":"내 PC·메신저에 붙여 일정·메일·파일 작업을 시키는 오픈소스 에이전트 프레임워크 두 개가 역대급 속도로 성장 중입니다. OpenClaw는 생성 1년 만에 39만 스타, Nous Research의 Hermes Agent는 25만 스타를 넘겼습니다.","why":"비개발자도 설치해 쓰는 ‘개인 에이전트’의 대화·권한 UX를 직접 체험해 볼 수 있는 가장 쉬운 샘플입니다.","url":"https://dev.to/rosgluk/trending-open-source-ai-projects-on-github-october-2026-4d42"},{"id":"gh-opencode","date":"2026-10-20","tags":["gh","tool"],"title":"OpenCode 21만★: 어떤 모델이든 붙이는 오픈소스 코딩 에이전트, Figma MCP 연동 목록에 포함","summary":"Claude Code·Cursor의 오픈소스 대안으로, 원하는 모델을 붙여 쓰는 터미널·에디터 에이전트입니다. Figma가 10월에 발표한 신규 MCP 연동 목록에도 들어갔습니다.","why":"Figma MCP로 연결하면 ‘Figma 디자인 → 코드’를 사내 모델로 돌릴 수 있어, 보안이 까다로운 조직에서 디자인-투-코드를 시도하기 좋습니다.","url":"https://github.com/anomalyco/opencode"},{"id":"gh-graphify","date":"2026-10-21","tags":["gh"],"title":"Graphify 13만★: 폴더 하나를 AI가 기억하는 지식 그래프로","summary":"코드·문서·PDF·설정이 담긴 폴더를 한 명령으로 질의 가능한 지식 그래프로 바꿔 AI 코딩 도구의 ‘기억’을 만들어 주는 도구입니다. 주간 4,500 스타씩 늘며 전 세계 83위 저장소가 됐습니다.","why":"디자인 시스템 문서와 리서치 노트를 그래프로 엮어 AI가 맥락을 잃지 않게 하는 실험에 그대로 쓸 수 있습니다.","url":"https://www.star-history.com/graphify-labs/graphify/"},{"id":"gh-firecrawl-browseruse","date":"2026-10-21","tags":["gh"],"title":"Firecrawl 19.5만★ / Browser Use 11.8만★: 에이전트의 ‘눈과 손’","summary":"Firecrawl은 웹을 AI가 읽기 좋은 데이터로 바꿔주고, Browser Use는 에이전트가 실제 브라우저를 조작하게 해줍니다. 둘 다 10월 트렌딩 상위권입니다.","why":"에이전트가 우리 서비스를 ‘사용자처럼’ 조작하는 시대입니다. 접근성 트리와 명확한 라벨이 곧 에이전트 호환성입니다.","url":"https://github.com/firecrawl/firecrawl"},{"id":"gh-openai-math","date":"2026-10-06","tags":["gh","ai"],"title":"openai/math: 내부 모델이 쓴 수학 논문 722편 공개, 공개 직후 1.5만★","summary":"OpenAI가 미공개 내부 모델이 생성한 수학 원고 722편과 Lean 형식 증명을 Apache-2.0으로 공개했습니다. 공개 직후 1.5만 스타를 넘기며 10월 월간 트렌딩에 올랐습니다.","why":"모델의 ‘추론 과정 요약’을 요약본·원문·증명 3단 구조로 보여주는 방식은 설명 가능한 AI UX의 참고 사례입니다.","url":"https://github.com/openai/math"},{"id":"gh-design-mcp","date":"2026-10-21","tags":["gh","tool"],"title":"디자이너용 MCP·디자인-투-코드 저장소 묶음: Onlook, figwright, OpenPencil, better-design","summary":"Onlook(2.7만★)은 실제 코드를 Figma처럼 시각 편집하는 도구, figwright는 Figma와 코드를 잇는 양방향 MCP 서버, OpenPencil은 프롬프트로 벡터 캔버스에 UI를 그리는 오픈소스 디자인 툴, better-design은 31개 스타일 테마와 WCAG 규칙을 담은 디자인 MCP 서버입니다.","why":"Claude Code·Cursor에 이 MCP들을 붙이면 ‘우리 디자인 토큰으로 코드 생성’을 바로 실험할 수 있습니다.","url":"https://github.com/onlook-dev/onlook"},{"id":"openai-devday-dots","date":"2026-09-29","tags":["big","ai"],"title":"OpenAI DevDay: 채팅이 끝나도 계속 일하는 에이전트 ‘Dots’, GPT-6.1 Sol","summary":"각 Dot은 자기 클라우드 컴퓨터와 브라우저를 갖고 반복 업무·후속 조치·하위 에이전트 위임을 수행하며, 규칙·권한·사전 확인을 설정할 수 있습니다. 기업 플랜은 관리자가 켜야 하고 Slack·Teams에서도 접근됩니다. 가격 정보는 출처 간 상충이 있어 적지 않았습니다.","why":"둥근 아바타가 자율적으로 일하는 Dots의 캐릭터·상태 표현은 에이전트 의인화 디자인의 대표 사례가 됐습니다.","url":"https://techcrunch.com/2026/09/29/openai-launches-dots-its-bubbly-agentic-avatar/"},{"id":"meta-charm","date":"2026-09-23","tags":["big"],"rumor":true,"title":"Meta Connect: 손바닥 AI 기기 ‘Charm’ 공개, 12월 출시 예정","summary":"AirPods 케이스 크기에 2인치 터치스크린·5G·듀얼 카메라·지문 센서를 넣은 기기입니다. 지문 센서를 탭하고 말하면 Muse 에이전트가 항공권 예약·메일 발송을 대신합니다. 연말 출시 예정이며 가격은 미정입니다. OpenAI 기기는 2026년 하반기 공개·2027년 출하로 알려져 있습니다.","why":"화면이 거의 없는 기기에서 음성·촉각·소형 디스플레이로 에이전트 상태를 전달하는 ‘포스트 스마트폰 UX’ 실전 사례입니다.","url":"https://www.dezeen.com/2026/09/25/meta-debuts-tamagotchi-style-ai-agent/"},{"id":"apple-homeview","date":"2026-10-13","tags":["big"],"title":"Apple ‘Welcome Home’: 가족 공용 홈 허브 HomeView, HomePod mini 2, 새 Apple TV 4K","summary":"HomeView($299)는 최대 6인 가족용 홈 허브로 앱·위젯·개인화 콘텐츠를 보여주며 11월 13일 출시됩니다. HomePod mini 2($149)는 추후 업데이트로 Siri AI 기능이 추가되고, Apple TV 4K 4세대는 A19 칩과 Wi-Fi 7을 탑재했습니다.","why":"가족 공용 7인치 안팎 터치 허브라는 새 폼팩터가 생겨, ‘멀티 유저·근거리 터치’ 레이아웃 가이드가 곧 필요해집니다.","url":"https://www.macrumors.com/2026/10/13/apple-october-13-recap/"},{"id":"apple-oct28","date":"2026-10-28","tags":["big"],"rumor":true,"title":"Apple 10월 28일 2차 발표 ‘Pro and Tell’. 첫 터치스크린 맥북 루머","summary":"애플이 10월 28일 두 번째 발표를 예고했고, 애널리스트들은 새 Mac(첫 터치스크린 노트북 가능성)과 OLED iPad mini를 예상합니다.","why":"맥에 터치가 들어오면 macOS 앱의 터치 타깃 크기와 호버 의존 패턴을 다시 봐야 합니다.","url":"https://www.cnbc.com/2026/10/19/apple-product-launch-event-oct-28-analysts-expect-touchscreen-laptop.html"},{"id":"ms-copilot-scaleback","date":"2026-10-21","tags":["big"],"title":"Microsoft, Windows 11에서 Copilot 노출 축소. 작업표시줄 검색창 중단, 탐색기 AI 액션 8개 제거","summary":"‘Microslop’ 역풍 속에 작업표시줄 Copilot 검색창을 일시 중단하고, 파일 탐색기 우클릭 메뉴의 Copilot 액션 8개(요약·FAQ 생성·파일 비교 등)를 11~12월에 걷어냅니다. 메모장의 Copilot 브랜딩도 제거합니다.","why":"‘모든 메뉴에 AI 버튼’이 사용자 반감을 산 대표 사례입니다. AI 진입점은 적고 분명하게 두라는 교훈입니다.","url":"https://www.windowslatest.com/2026/10/21/microsoft-is-now-scaling-back-copilot-in-windows-11-amid-microslop-backlash-pulling-8-ai-actions-from-file-explorer-and-calling-it-simplifying/"},{"id":"oneui9","date":"2026-10-20","tags":["big","kr"],"title":"삼성 One UI 9(Android 17) 배포 확대: S25·S24·폴드6으로","summary":"One UI 9이 갤럭시 S26을 시작으로 10월 들어 S25·S24·Z 폴드6/플립6·A56 등으로 확대되고 있습니다. AI 프라이버시 알림, 위치 사용 인디케이터, Bixby 업그레이드가 포함되며 일부 중급기는 주요 AI 기능이 빠집니다.","why":"국내 안드로이드 사용자 다수가 Android 17 기반으로 넘어갑니다. 앱의 Material 3 Expressive 대응과 One UI 9 신규 권한 UI를 확인할 시점입니다.","url":"https://www.sammyfans.com/2026/10/20/one-ui-9-0-official-update-now-rolling-out-to-these-samsung-phones/"},{"id":"ai-browsers","date":"2026-10-16","tags":["big"],"title":"AI 브라우저 정리: ChatGPT Atlas 종료 후 크롬 확장으로, Perplexity Comet은 ‘Personal Computer’로","summary":"OpenAI는 독립 브라우저 Atlas를 8월 9일 종료하고 기능을 크롬 확장과 데스크톱 앱으로 옮겼으며, 10월 중순 확장에 탭 정리·작업 수행 기능을 추가했습니다. Perplexity Comet은 로컬 파일 편집·컴퓨터 조작까지 확장 중입니다. 보안 업계는 에이전트 브라우저의 프롬프트 인젝션 악용을 경고했습니다.","why":"‘AI 브라우저’는 별도 제품보다 기존 브라우저 안의 사이드바·확장 형태로 수렴하는 중입니다.","url":"https://9to5mac.com/2026/07/09/openai-is-discontinuing-chatgpt-atlas-its-standalone-desktop-browser/"},{"id":"kakaotalk-channel","date":"2026-10-21","tags":["kr"],"title":"카카오톡 채널 개편: 숏폼 격자 피드 ‘콘텐츠형 채널홈’, 이용자 의견 창구, 메시지 서식","summary":"채널홈과 소식 화면을 개편해 소식·숏폼을 격자형 피드로 보는 ‘콘텐츠형 채널홈’을 추가했습니다. ‘카카오톡은 지금’ 페이지에 이용자 의견을 직접 받는 창구를 만들고, 입력창에 굵게·기울임·목록 서식을 넣었습니다. 지난해 대개편 반발 이후 1년 만의 순차 개선입니다.","why":"대규모 개편 역풍 뒤 ‘의견 수렴 창구를 제품 안에 상설화’한 접근은 국내 변경 관리 UX의 참고 사례입니다.","url":"https://www.ddaily.co.kr/page/view/2026102018215623070"},{"id":"navermap-glasses","date":"2026-10-12","tags":["kr"],"title":"네이버지도, AI 글래스 음성 길안내. 메타 글래스 먼저, 구글·삼성 아이웨어로 확대","summary":"스마트폰을 보지 않고 AI 글래스로 방향·계단·에스컬레이터 정보까지 음성 안내하는 기능을 메타 글래스에 먼저 적용하고, 연내 출시될 구글·삼성 아이웨어로 확대합니다. 디스플레이형 글래스에서는 AR 경로·주변 매장·쿠폰이 추가될 예정입니다.","why":"국내 대표 서비스가 ‘화면 없는 음성 내비’를 상용화한 첫 사례입니다. 음성 안내 문구 설계와 화면 없는 UX가 실무 과제가 됐습니다.","url":"https://www.mt.co.kr/tech/2026/10/12/2026101209263248102"},{"id":"coupang-ai-pdp","date":"2026-10-23","tags":["kr"],"title":"쿠팡, AI 상품정보(한눈에 보기·하이라이트·리뷰 요약)를 상세페이지 전반으로 확대","summary":"8월 도입한 AI ‘상품 한눈에 보기’, 상품명 아래 ‘상품 하이라이트’, 가전 ‘AI 인포그래픽’, 장단점 리뷰 요약을 10월 들어 상세페이지 전반으로 넓힙니다.","why":"커머스 상세페이지가 ‘셀러가 올린 이미지’ 중심에서 ‘AI가 재구성한 요약 블록’ 중심으로 바뀌는 국내 대표 사례입니다.","url":"https://www.etoday.co.kr/news/view/2612000"},{"id":"kftc-darkpattern-guide","date":"2026-10-06","tags":["policy","kr"],"pick":true,"title":"공정위, 다크패턴 13개 유형의 UI 예시가 담긴 가이드라인 배포","summary":"탈퇴 버튼 숨기기, 가격 숨기기, 취소·해지 방해 등 13개 유형의 판단 기준과 UI·UX 예시를 담은 통합 가이드라인입니다. 법적 구속력은 없지만 2025년 2월 시행된 개정 전자상거래법의 실무 해석 기준으로 쓰입니다. 첫 과태료 사례(2025.10)에는 NHN벅스를 포함한 4개사가 있었습니다. 과태료 상한 인상 시행일은 출처 간 차이가 있어 원문 확인이 필요합니다.","why":"‘이런 UI를 쓰면 위반’이 처음으로 그림과 함께 명문화된 문서입니다. 구독·결제·해지 플로우를 13개 유형으로 전수 점검하는 것이 좋습니다.","url":"https://view.asiae.co.kr/article/2026100609092936679"},{"id":"ai-basic-act-amend","date":"2026-10-13","tags":["policy","kr"],"title":"AI기본법 첫 개정안 국무회의 통과. 생성형 AI 표시 의무 계도기간은 2027년 1월경 종료","summary":"2026년 1월 22일 시행된 AI기본법의 첫 개정안이 통과됐습니다. 정부 사업으로 만든 AI 학습 데이터를 AI허브에 연계하도록 의무화하며 공포 6개월 후 시행 예정입니다. 기존 법의 고영향 AI·생성형 AI 표시 의무는 최소 1년 계도기간이 2027년 1월경 끝납니다.","why":"생성형 AI 결과물 표시(워터마크·고지) UI가 2027년부터 실제 제재 대상이 됩니다. 지금부터 표준 컴포넌트로 준비해 두어야 합니다.","url":"https://www.newspim.com/news/view/20261013001182"},{"id":"eu-ai-act-omnibus","date":"2026-10-13","tags":["policy"],"title":"EU AI Act ‘디지털 옴니버스’ 발효: 고위험 의무는 2027~28년으로 연기, 투명성 의무는 12월 2일 그대로","summary":"고위험 AI 의무가 채용·교육 등 Annex III는 2027년 12월 2일, 제품안전법 대상 Annex I은 2028년 8월 2일로 미뤄졌습니다. 반면 Article 50 투명성 의무(AI와 상호작용 중임을 알리는 고지, 생성 콘텐츠 워터마킹)는 예정대로 2026년 12월 2일 적용됩니다.","why":"EU 사용자가 있는 서비스는 ‘AI와 대화 중임을 알리는 UI’와 ‘AI 생성 표시’를 올 12월 2일까지 갖춰야 합니다.","url":"https://www.technology.org/2026/10/13/eu-ai-act-deadlines-after-the-digital-omnibus-what-applies-from-december-2026-to-august-2028/"}],"jobs":{"kr":{"jd":{"title":"NHN 2025 UX 설계 디자이너","roleName":"UX 설계 디자이너 (경력 1~3년, 정규직, 성남 분당 · 마감 2025.10.15)","note":"2025년 NHN 본사 공고 중 ‘UX 디자이너’에 가장 가까운 건입니다. 아래 문구는 채용 플랫폼에 노출된 요약 기준이며, AI·생성형 AI 요건은 명시되지 않았습니다. 같은 해 게임부문은 ‘게임 UX’·‘게임 UI/UX 디자이너’ 명칭을 썼고, 2026년 2월 NHN Dooray 공고에서 처음 ‘AI 관련 화면 UX 개선’과 ‘디자인 시스템(DDS) 운영’이 핵심 업무로 등장했습니다.","duties":["리서치부터 전략 수립, 기획, 설계까지 UX 전 과정을 직접 수행","사용자 경험 진단 및 개선안 제안"],"requirements":["UX 디자인 경력 1~3년 미만 또는 이에 준하는 경험","사용자 경험과 사업 목표를 함께 고려하는 역량","이해관계자 설득 능력","Figma 등 디자인 툴 활용 능력","앱·PC 등 다양한 디바이스 환경 이해"],"preferred":["UX·IT·신기술 트렌드 학습에 관심이 많은 분","여러 도메인을 빠르게 이해하는 분","리서치 인사이트를 시각적으로 정리하는 분"],"sources":[{"label":"사람인 공고","url":"https://www.saramin.co.kr/zf_user/jobs/view?rec_idx=51577052"},{"label":"NHN 게임부문 2025 공채","url":"https://www.etnews.com/20250801000091"},{"label":"NHN Dooray 2026 공고","url":"https://m.jobkorea.co.kr/Recruit/GI_Read/48607380"},{"label":"NHN 디자이너 클로드 교육","url":"https://www.bloter.net/news/articleView.html?idxno=674556"}]},"up":[{"title":"프로덕트 디자이너 (통합형)","dir":"up","delta":"토스 6→2 통합","desc":"토스는 2026년 4월 디자인 직무 6개를 Product Designer / Visual Designer 2개로 합쳤습니다. 화면 크기·채널 구분이 사라지고 ‘어떤 맥락에서 어떤 문제를 겪는지’를 다루는 직무로 정의됩니다.","fit":"높음","fitWhy":"NHN JD의 ‘리서치~전략~설계 전 과정’과 거의 같은 범위. 직무명만 바뀌는 경우가 많습니다.","sources":[{"label":"toss.tech","url":"https://toss.tech/article/Designer"}]},{"title":"AI 프로덕트 / AI 서비스 디자이너","dir":"up","delta":"신설 확산","desc":"카카오 ‘AI 서비스 UI 디자이너’, 카카오뱅크 ‘프로덕트 디자이너-AI’, 토스증권 ‘PD (AI Contents)’, 네이버클라우드 ‘AI 서비스 프로덕트 디자이너’ 등 AI 제품 전담 디자이너 공고가 2025~2026년에 연달아 생겼습니다.","fit":"중간~높음","fitWhy":"기본 역량은 같지만 ‘AI/LLM 기반 제품 UX 설계 경험’을 우대·요구합니다.","sources":[{"label":"카카오 공고","url":"https://kr.indeed.com/q-%EC%B9%B4%EC%B9%B4%EC%98%A4ai-%EC%B1%84%EC%9A%A9%EA%B3%B5%EA%B3%A0.html"},{"label":"네이버클라우드","url":"https://www.nklcb.net/jobList/post/6959022245621954c75c7276"}]},{"title":"디자인 시스템 운영 (디자이너 겸임)","dir":"up","delta":"JD 핵심 업무화","desc":"NHN Dooray 2026 공고는 ‘AI 관련 화면 UX 개선’과 ‘디자인 시스템(DDS) 운영·컴포넌트 가이드 정비’를 핵심 업무로 적었습니다. 당근은 AI 결과물의 품질 하한선을 지키는 수단으로 디자인 시스템을 재정의했습니다.","fit":"높음","fitWhy":"NHN 내부에서 2025년 7월부터 디자이너 대상 ‘디자인 시스템 자동화(클로드 코드)’ 교육을 시작했습니다.","sources":[{"label":"NHN Dooray 공고","url":"https://m.jobkorea.co.kr/Recruit/GI_Read/48607380"},{"label":"당근 SEED","url":"https://seed-design.io/updates/why-we-hired-a-design-engineer"}]},{"title":"디자인 엔지니어 (Design Engineer)","dir":"up","delta":"국내 첫 신설","desc":"당근 디자인시스템팀이 국내 최초급으로 채용. 토스플레이스는 ‘Frontend UX Engineer (Design System)’로 디자인 린터를 만듭니다. 해외 AI 네이티브 기업(Cursor 등)은 디자인 공고가 이 직무 하나뿐인 경우도 있습니다.","fit":"낮음~중간","fitWhy":"Figma와 코드 에디터 양쪽 숙련을 요구. 바이브 코딩 경험이 진입 통로가 됩니다.","sources":[{"label":"당근 공고","url":"https://careers.daangn.com/jobs/role/7791182003/"},{"label":"모비인사이드","url":"https://www.mobiinside.co.kr/2026/09/23/ai-era-product-designer-role-expansion/"}]},{"title":"Design Staff · AI 디자인 인프라","dir":"up","delta":"토스 신설","desc":"AI를 활용한 새로운 디자인 방법론을 만들고, 디자이너들이 더 다양한 시도를 할 수 있는 도구와 인프라를 구축하는 시니어 직무입니다.","fit":"낮음","fitWhy":"디자인 챕터 전체의 AI 워크플로를 설계하는 리드급 직무입니다.","sources":[{"label":"토스 공고","url":"https://toss.im/career/job-detail?job_id=7816833003"}]},{"title":"UX 컨설팅 + SEO/GEO 진단","dir":"up","delta":"NHN AD 신입","desc":"NHN AD 2026 신입 공고는 광고주 사이트 UI/UX 컨설팅에 ‘SEO/GEO(생성형 엔진 최적화) 진단’을 묶었습니다. AI 검색 대응 업무가 UX 직무에 편입된 사례입니다.","fit":"중간","fitWhy":"고객 여정 분석·이탈 지점 진단은 NHN JD의 ‘경험 진단·개선안 제안’과 같습니다.","sources":[{"label":"NHN AD 공고","url":"http  기업(NHN)의 UX 디자이너이며 개발자가 아닙니다. 모든 산출물은 한국어로 씁니다.\n\n앱 주소: https://claude.ai/artifact/Aohb1epNpKS27Ab91LpC4e\n앱은 데이터 저장소(ArtifactData 도구: ToolSearch \"select:ArtifactData\" 로 먼저 불러오세요)의 `news` 컬렉션과 `meta/latest`, `meta/status` 문서를 실시간으로 읽습니다. 페이지 파일은 수정하지 말고 저장소 문서만 쓰세요. 코드 변경·커밋·푸시·PR 은 하지 않습니다.\n\n절차:\n1. 먼저 `meta` 컬렉션의 `status` 문서를 get 하고, set 합니다: {\"state\":\"running\",\"startedAt\":\"<지금 ISO8601 UTC>\"} (이미 있으면 읽은 version 을 if_version 으로 넘기세요).\n2. 중복을 피하기 위해 기존 항목을 파악합니다: ArtifactData list 로 `news` 컬렉션을 읽고(limit 300), Artifact 도구 read 로 앱 페이지를 읽어 `<script id=\"seed\">` 안 JSON 의 news 배열 제목·URL 도 확인합니다. 이미 있는 소식은 다시 쓰지 않습니다.\n3. WebSearch(ToolSearch \"select:WebSearch\" 로 불러오고 mode \"extended\")로 오늘 기준 최근 2주의 소식을 조사해 15~25건을 고릅니다. 분류와 태그 키:\n   - ai: AI 모델 출시·루머 (Gemini, GPT, Claude, Meta Muse, Grok, Mistral, DeepSeek/Qwen, 네이버·카카오·LG·업스테이지·SKT 등 국산 모델)\n   - tool: 디자인 툴 (Figma, Adobe, Framer, Lovable, v0, Cursor, Canva, iOS/Android 디자인 언어, 생성형 UI·에이전틱 UX 흐름)\n   - gh: GitHub 트렌딩·오픈소스 중 디자이너·프로덕트 빌더에게 의미 있는 저장소 5~8건\n   - big: 빅테크 제품·플랫폼 (Apple, Google, Microsoft, Meta, Samsung, AI 브라우저·AI 하드웨어)\n   - policy: 규제·정책 (EU AI Act, 한국 AI기본법, 다크패턴 규제 등 UX 에 영향을 주는 것)\n   - kr: 국내 소식 (네이버, 카카오, 토스, 쿠팡, 삼성, NHN 등). 국내 소식은 kr 과 함께 위 분류 태그를 같이 붙입니다.\n   날짜를 꼼꼼히 확인하고, 공식 발표가 아닌 것은 rumor 를 true 로 둡니다. 개수보다 정확성을 우선합니다.\n4. 각 항목을 `news` 컬렉션에 씁니다. 문서 id 는 \"YYYY-MM-DD-영문소문자슬러그\" (예: 2026-11-03-figma-specs). 본문:\n   {\"title\":\"한국어 제목 60자 이내\",\"date\":\"YYYY-MM-DD\",\"summary\":\"한국어 요약 2~3문장\",\"why\":\"디자이너에게 왜 중요한지 1~2문장\",\"url\":\"출처 URL 1개\",\"tags\":[\"ai\"],\"pick\":false,\"rumor\":false,\"fetchedAt\":\"<지금 ISO8601 UTC>\"}\n   가장 중요한 4건에 \"pick\": true 를 줍니다. 여러 건은 batch 로 한 번에(50건 이하) 씁니다.\n5. `meta` 컬렉션의 `latest` 문서를 set 합니다 (있으면 get → if_version). 형식:\n   {\"updatedAt\":\"YYYY-MM-DD\",\"week\":\"YYYY년 M월 N주\",\"headline\":\"이번 주 핵심 한 문장 25자 이내\",\"briefing\":[{\"icon\":\"agent\",\"t\":\"굵은 제목 12자 이내\",\"d\":\"한 줄 설명 45자 이내\"} ×3~4],\"footnote\":\"다음 주 체크: 일정 2~3개\",\"tiles\":[{\"k\":\"지표명\",\"v\":\"숫자\",\"u\":\"단위\"} ×3],\"sourceNote\":\"수치 출처 한 줄\"}\n   icon 은 agent, rules, jobs, policy, chart, tool 중 하나. tiles 에는 가능하면 채용·공고 관련 최신 수치를 1개 이상 넣습니다(예: Academy UX 월간 미국 UX 공고 지표, 잡코리아 AI 직무 공고 증감).\n6. 마지막으로 `meta/status` 를 set 합니다: {\"state\":\"done\",\"startedAt\":\"<1단계 값>\",\"finishedAt\":\"<지금 ISO8601 UTC>\",\"added\":<추가한 news 문서 수>,\"note\":\"한 줄 요약\"}. 실패하면 {\"state\":\"error\",\"finishedAt\":\"...\",\"note\":\"원인 한 줄\"} 을 씁니다. 어떤 경우에도 status 를 running 으로 남기지 마세요.\n\n규칙:\n- 개인정보(이름+아이디, 전화번호, 이메일 등)와 인증정보는 어떤 문서에도 쓰지 않습니다. 기사 인터뷰이는 소속·직함만 씁니다.\n- 출처 URL 이 없는 항목은 쓰지 않습니다. 마크다운 기호 없이 평문으로 씁니다.\n- 끝나면 추가한 항목 수와 헤드라인을 한 줄로 보고합니다."}}</script>

    moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
    auto: '<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/>',
    check: '<svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>',
    spin: '<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>',
    warn: '<svg viewBox="0 0 24 24"><path d="M12 4 2.5 20h19z"/><path d="M12 10v4M12 17h.01"/></svg>'
  };

  // ---- state ----
  const state = {
    tab: 'home', region: 'kr', country: 'us', filter: 'all',
    news: SEED.news.slice(), jobs: SEED.jobs, meta: SEED.meta,
    saved: load('saved', []), sample: null, mcp: null, status: null,
    refreshAt: load('refreshAt', null), lastDone: load('lastDone', null)
  };
  const TAGS = SEED.tags;
  const COUNTRIES = SEED.jobs.global.countries;

  // ---- theme ----
  const themes = ['system','light','dark'];
  function applyTheme(t){
    const root = document.documentElement;
    if (t === 'system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', t);
    $('#themeIc').innerHTML = t === 'light' ? ICONS.sun : t === 'dark' ? ICONS.moon : ICONS.auto;
    $('#themeBtn').title = t === 'light' ? '라이트 모드' : t === 'dark' ? '다크 모드' : '시스템 설정 따름';
  }
  let theme = load('theme', 'system'); if (!themes.includes(theme)) theme = 'system';
  applyTheme(theme);
  $('#themeBtn').addEventListener('click', () => {
    theme = themes[(themes.indexOf(theme) + 1) % themes.length]; save('theme', theme); applyTheme(theme);
    toast(theme === 'light' ? '라이트 모드' : theme === 'dark' ? '다크 모드' : '시스템 설정을 따릅니다');
  });

  // ---- header ----
  function renderHeader(){ $('#hdrDate').textContent = String(state.meta.updatedAt).slice(0,10).replace(/-/g,'.') + ' 기준'; }

  // ---- navigation ----
  function go(tab){
    state.tab = tab;
    $$('.view').forEach(v => v.classList.toggle('active', v.dataset.view === tab));
    $$('.tabbar button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
    window.scrollTo({top:0}); save('tab', tab);
    if (tab === 'saved') renderSaved();
  }
  $$('.tabbar button').forEach(b => b.addEventListener('click', () => go(b.dataset.tab)));
  $$('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));

  // ---- helpers ----
  function fmtDate(d){ return d ? d.slice(5).replace('-', '.') : ''; }
  function freshNews(){
    const cutoff = new Date(state.meta.updatedAt); cutoff.setDate(cutoff.getDate() - 60);
    const c = cutoff.toISOString().slice(0,10);
    return state.news.filter(n => (n.date || '') >= c).sort((a,b) => (b.date||'').localeCompare(a.date||''));
  }
  function isNew(n){ return !!(n.fetchedAt && state.refreshAt && n.fetchedAt >= state.refreshAt); }

  // ---- home ----
  function renderHome(){
    const m = state.meta;
    const rows = (m.briefing || []).map(b => typeof b === 'string' ? {icon:'chart', t: b.slice(0, 18), d: b} : b);
    $('#brief').innerHTML = `
      <div class="week">${esc(m.week)}</div>
      <h2>${esc(m.headline)}</h2>
      <div class="rows">${rows.map(r => `<div class="brow"><div class="ic">${ICONS[r.icon] || ICONS.chart}</div><div><div class="t">${esc(r.t)}</div><div class="d">${esc(r.d)}</div></div></div>`).join('')}</div>
      ${m.footnote ? `<div class="next">${esc(m.footnote)}</div>` : ''}`;
    $('#tiles').innerHTML = (m.tiles||[]).map(x => `<div class="tile"><div class="k">${esc(x.k)}</div><div class="v num">${esc(x.v)}<small>${esc(x.u||'')}</small></div></div>`).join('');
    const kr = state.jobs.kr;
    $('#homeJobs').innerHTML = kr.up.slice(0,2).concat(kr.down.slice(0,1)).map(roleHTML).join('');
    const list = freshNews(); let top = list.filter(n => n.pick).slice(0,4);
    if (top.length < 3) top = list.slice(0,4);
    $('#homeNews').innerHTML = top.map(newsHTML).join('') || '<div class="empty">아직 이슈가 없습니다.</div>';
    $('#homeNote').textContent = m.sourceNote || '';
    wireNews();
  }

  // ---- jobs ----
  function roleHTML(r){
    const dir = r.dir === 'up' ? '↑ 늘어남' : r.dir === 'down' ? '↓ 줄어듦' : '→ 관찰 중';
    const srcs = (r.sources||[]).map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label||host(s.url))}</a>`).join('');
    return `<div class="role">
      <div class="row"><span class="dir ${esc(r.dir)}">${dir}${r.delta ? ' · ' + esc(r.delta) : ''}</span><h3>${esc(r.title)}</h3></div>
      <p>${esc(r.desc)}</p>
      ${r.fit ? `<div class="fit"><b>NHN JD 적합도 ${esc(r.fit)}</b> · ${esc(r.fitWhy||'')}</div>` : ''}
      ${srcs ? `<div class="src">${srcs}</div>` : ''}</div>`;
  }
  function postingHTML(p){
    return `<div class="posting"><span class="co">${esc(p.company)} · ${esc(p.when||'')}</span><span class="t">${esc(p.title)}</span><span class="d">${esc(p.desc)}</span>${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">공고 보기 ↗</a>` : ''}</div>`;
  }
  function renderJobs(){
    const kr = state.jobs.kr, jd = kr.jd;
    $('#jdCard').innerHTML = `
      <summary><span>${esc(jd.title)}</span></summary>
      <p class="note">${esc(jd.note)}</p>
      <dl class="kv">
        <dt>직무명</dt><dd>${esc(jd.roleName)}</dd>
        <dt>주요 업무</dt><dd><ul>${jd.duties.map(d => `<li>${esc(d)}</li>`).join('')}</ul></dd>
        <dt>자격 요건</dt><dd><ul>${jd.requirements.map(d => `<li>${esc(d)}</li>`).join('')}</ul></dd>
        <dt>우대 사항</dt><dd><ul>${jd.preferred.map(d => `<li>${esc(d)}</li>`).join('')}</ul></dd>
        <dt>출처</dt><dd>${jd.sources.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`).join(' · ')}</dd>
      </dl>`;
    $('#krUp').innerHTML = kr.up.map(roleHTML).join('');
    $('#krDown').innerHTML = kr.down.map(roleHTML).join('');
    $('#krPostings').innerHTML = kr.postings.map(postingHTML).join('');
    $('#countryChips').innerHTML = COUNTRIES.map(c => `<button class="chip" data-country="${esc(c.key)}" aria-pressed="${String(c.key===state.country)}">${esc(c.label)}</button>`).join('');
    $$('#countryChips .chip').forEach(b => b.addEventListener('click', () => { state.country = b.dataset.country; renderGlobal(); }));
    renderGlobal();
    const sk = state.jobs.skills;
    $('#skillMeta').textContent = sk.meta;
    $('#skills').innerHTML = sk.items.map(s => `<div class="skill"><div><div class="n">${esc(s.name)}</div><div class="d">${esc(s.desc)}</div></div><div><div class="pct num">${esc(s.label)}</div><div class="bar"><i style="width:${Math.max(4,Math.min(100,s.pct))}%"></i></div></div></div>`).join('');
    $('#jobsNote').innerHTML = state.jobs.note;
  }
  function renderGlobal(){
    $$('#countryChips .chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.country === state.country)));
    const g = state.jobs.global.byCountry[state.country];
    if (!g) { $('#globalBody').innerHTML = '<div class="empty">데이터가 없습니다.</div>'; return; }
    $('#globalBody').innerHTML = `
      <div class="group"><div class="group-h"><h2>${esc(g.label)} 수요 흐름</h2></div>
        <div class="card"><p class="summary">${esc(g.summary)}</p></div>
        <div class="tiles">${(g.stats||[]).map(x => `<div class="tile"><div class="k">${esc(x.k)}</div><div class="v num">${esc(x.v)}<small>${esc(x.u||'')}</small></div></div>`).join('')}</div>
        ${g.statSource ? `<p class="foot">${g.statSource}</p>` : ''}
      </div>
      ${g.up && g.up.length ? `<div class="group"><div class="group-h"><h2>늘어나는 직무</h2></div><div class="list">${g.up.map(roleHTML).join('')}</div></div>` : ''}
      ${g.down && g.down.length ? `<div class="group"><div class="group-h"><h2>줄어들거나 합쳐지는 직무</h2></div><div class="list">${g.down.map(roleHTML).join('')}</div></div>` : ''}
      ${g.postings && g.postings.length ? `<div class="group"><div class="group-h"><h2>실제 공고 예시</h2></div><div class="list">${g.postings.map(postingHTML).join('')}</div></div>` : ''}`;
  }
  $$('.seg [data-region]').forEach(b => b.addEventListener('click', () => {
    state.region = b.dataset.region;
    $$('.seg [data-region]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    $('#jobsKr').hidden = state.region !== 'kr'; $('#jobsGlobal').hidden = state.region !== 'global';
  }));

  // ---- news ----
  function newsHTML(n){
    const saved = state.saved.includes(n.id);
    return `<article class="news" data-id="${esc(n.id)}">
      <div class="row"><div class="tags">${isNew(n) ? '<span class="tag new">NEW</span>' : ''}${(n.tags||[]).map(t => `<span class="tag">${esc(TAGS[t]||t)}</span>`).join('')}${n.rumor ? '<span class="tag">루머·예정</span>' : ''}</div><span class="date num">${esc(fmtDate(n.date))}</span></div>
      <h3>${esc(n.title)}</h3>
      <p class="sum">${esc(n.summary)}</p>
      ${n.why ? `<p class="why"><b>디자이너에게</b> ${esc(n.why)}</p>` : ''}
      <div class="acts">
        ${n.url ? `<a class="btn link" href="${esc(n.url)}" target="_blank" rel="noopener">원문 ↗ <small>${esc(host(n.url))}</small></a>` : ''}
        <button class="btn" data-explain="${esc(n.id)}" hidden>쉽게 설명</button>
        <button class="btn plain" data-save="${esc(n.id)}" aria-pressed="${saved}">${saved ? '저장됨' : '저장'}</button>
      </div>
      <div class="explain" id="ex-${esc(n.id)}" hidden></div></article>`;
  }
  function renderNewsChips(){
    const keys = ['all'].concat(Object.keys(TAGS));
    $('#newsChips').innerHTML = keys.map(k => `<button class="chip" data-filter="${k}" aria-pressed="${String(k===state.filter)}">${k==='all'?'전체':esc(TAGS[k])}</button>`).join('');
    $$('#newsChips .chip').forEach(b => b.addEventListener('click', () => { state.filter = b.dataset.filter; renderNewsChips(); renderNews(); }));
  }
  function renderNews(){
    const items = freshNews().filter(n => state.filter === 'all' || (n.tags||[]).includes(state.filter));
    $('#newsList').innerHTML = items.map(newsHTML).join('') || '<div class="empty">이 분류에는 아직 항목이 없습니다.</div>';
    wireNews();
  }
  function renderSaved(){
    const items = state.news.filter(n => state.saved.includes(n.id)).sort((a,b) => (b.date||'').localeCompare(a.date||''));
    $('#savedMeta').textContent = items.length ? items.length + '개' : '';
    $('#savedList').innerHTML = items.map(newsHTML).join('') || '<div class="empty">이슈 카드의 「저장」을 누르면 여기에 모입니다.</div>';
    wireNews();
  }
  function wireNews(){
    $$('[data-save]').forEach(b => b.onclick = () => {
      const id = b.dataset.save; const i = state.saved.indexOf(id);
      if (i >= 0) state.saved.splice(i,1); else state.saved.push(id);
      save('saved', state.saved);
      $$(`[data-save="${CSS.escape(id)}"]`).forEach(x => { const on = state.saved.includes(id); x.setAttribute('aria-pressed', String(on)); x.textContent = on ? '저장됨' : '저장'; });
      toast(i >= 0 ? '저장을 해제했습니다' : '저장했습니다');
      if (state.tab === 'saved') renderSaved();
    });
    $$('[data-explain]').forEach(b => { b.hidden = !state.sample; b.onclick = () => explain(b.dataset.explain, b); });
  }
  function rerenderAll(){ renderHeader(); renderHome(); renderNews(); if (state.tab === 'saved') renderSaved(); }

  // ---- Claude: plain-language explanation ----
  async function explain(id, btn){
    const n = state.news.find(x => x.id === id); if (!n || !state.sample) return;
    const box = document.getElementById('ex-' + id); box.hidden = false; btn.disabled = true;
    box.innerHTML = '<span class="lbl">CLAUDE</span>생각하는 중…';
    const prompt = `당신은 IT 기업 UX 디자이너의 동료입니다. 아래 뉴스 항목을, 개발 지식이 없는 UX 디자이너가 이해할 수 있도록 한국어로 쉽게 풀어 설명하세요. 아래 제공된 내용만 근거로 삼고, 모르는 사실은 지어내지 마세요. 형식: 1) 한 줄 요약 2) 용어 풀이(필요한 경우만, 최대 3개) 3) 내 업무에 미치는 영향 2문장 4) 지금 해볼 것 1가지. 전체 6~9문장, 마크다운 기호 없이 평문으로.\n\n제목: ${n.title}\n날짜: ${n.date}\n요약: ${n.summary}\n디자이너 관점: ${n.why||''}\n출처: ${n.url||''}`;
    try {
      const ctl = new AbortController();
      const { text } = await state.sample(prompt, { modelTier: 'quick', signal: ctl.signal, onText: ({text}) => { box.innerHTML = '<span class="lbl">CLAUDE</span>' + esc(text); } });
      box.innerHTML = '<span class="lbl">CLAUDE</span>' + esc(text);
    } catch (e) {
      const code = e && e.code;
      if (['not_granted','sampling_disabled','not_declared','capability_disabled'].includes(code)) { state.sample = null; $$('[data-explain]').forEach(x => x.hidden = true); box.hidden = true; }
      else if (code === 'cancelled') box.hidden = true;
      else box.innerHTML = '<span class="lbl">CLAUDE</span>' + esc(e && e.text ? e.text : '') + (code === 'rate_limited' ? '\n지금은 요청이 많습니다. 잠시 후 다시 눌러 주세요.' : '\n설명을 가져오지 못했습니다. 다시 시도해 주세요.');
    } finally { btn.disabled = false; }
  }

  // ---- refresh: ask a Claude work session to fetch fresh news into the store ----
  const REFRESH_TIMEOUT_MS = 25 * 60 * 1000, COOLDOWN_MS = 10 * 60 * 1000;
  function banner(kind, t, d, progress){
    const el = $('#banner');
    if (!kind) { el.hidden = true; el.innerHTML = ''; return; }
    el.hidden = false;
    el.innerHTML = `<div class="ic ${kind === 'spin' ? 'spin' : ''}">${ICONS[kind] || ICONS.check}</div><div class="tx"><div class="t">${esc(t)}</div>${d ? `<div class="d">${esc(d)}</div>` : ''}${progress ? '<div class="progress"><i></i></div>' : ''}</div><button class="x" aria-label="닫기">×</button>`;
    $('.x', el).onclick = () => { el.hidden = true; };
  }
  function syncRefreshUI(){
    const btn = $('#refreshBtn'); if (!state.mcp) { btn.hidden = true; return; }
    btn.hidden = false;
    const s = state.status, now = Date.now(), reqAt = state.refreshAt ? Date.parse(state.refreshAt) : 0;
    const running = s && s.state === 'running' && (!s.startedAt || Date.parse(s.startedAt) > reqAt - 3*60*1000);
    const waiting = reqAt && now - reqAt < REFRESH_TIMEOUT_MS && !(s && s.finishedAt && Date.parse(s.finishedAt) >= reqAt);
    if (running || waiting) {
      btn.disabled = true; btn.classList.add('spin');
      banner('spin', '새 소식을 조사하고 있어요', '보통 5~10분 걸립니다. 이 화면을 닫아도 계속 진행되고, 끝나면 자동으로 반영됩니다.', true);
    } else {
      btn.classList.remove('spin');
      const doneAt = s && s.finishedAt ? Date.parse(s.finishedAt) : 0;
      btn.disabled = doneAt && now - doneAt < COOLDOWN_MS;
      if (reqAt && s && doneAt >= reqAt && state.lastDone !== s.finishedAt) {
        state.lastDone = s.finishedAt; save('lastDone', s.finishedAt);
        if (s.state === 'done') { banner('check', `새 소식 ${s.added || 0}개를 가져왔어요`, s.note || '', false); toast('새 소식이 반영됐습니다'); }
        else banner('warn', '이번 조사는 실패했어요', s.note || '잠시 후 다시 시도해 주세요.', false);
      } else if (reqAt && now - reqAt >= REFRESH_TIMEOUT_MS && !(doneAt >= reqAt) && state.lastDone !== 'timeout:' + state.refreshAt) {
        state.lastDone = 'timeout:' + state.refreshAt; save('lastDone', state.lastDone);
        banner('warn', '응답이 늦어지고 있어요', '잠시 후 다시 시도해 주세요. claude.ai 세션 목록에서 진행 상황을 볼 수 있습니다.', false);
      }
    }
  }
  async function requestRefresh(){
    if (!state.mcp) return;
    const btn = $('#refreshBtn'); btn.disabled = true; btn.classList.add('spin');
    banner('spin', '조사 세션을 시작하는 중…', '처음에는 Claude Code Remote 사용 허용을 묻습니다.', true);
    const stamp = new Date();
    const input = { environment_id: CFG.envId, title: '트렌드 레이더 새로고침 ' + stamp.toISOString().slice(0,16).replace('T',' '), prompt: CFG.prompt, tags: ['trend-radar-refresh'] };
    try {
      try { await state.mcp.callTool('Claude Code Remote', 'create_session', Object.assign({ permission_mode: 'auto' }, input)); }
      catch (e) { if (e && e.code === 'tool_error' && /permission/i.test(String(e.message))) await state.mcp.callTool('Claude Code Remote', 'create_session', input); else throw e; }
      state.refreshAt = stamp.toISOString(); save('refreshAt', state.refreshAt);
      state.lastDone = null; save('lastDone', null);
      toast('조사를 시작했습니다'); syncRefreshUI();
    } catch (e) {
      const code = e && e.code; btn.disabled = false; btn.classList.remove('spin');
      const msg = {
        server_not_connected: 'claude.ai 설정 → 커넥터에서 「Claude Code Remote」를 연결한 뒤 다시 눌러 주세요.',
        needs_reauth: 'claude.ai 설정 → 커넥터에서 「Claude Code Remote」를 다시 연결해 주세요.',
        not_in_manifest: '이 페이지의 커넥터 권한이 꺼져 있어요. 페이지 권한 메뉴에서 켜 주세요.',
        approval_required: '요청을 허용해야 조사가 시작됩니다. 다시 누르고 「허용」을 선택해 주세요.',
        blocked_by_policy: '조직 정책으로 이 기능을 쓸 수 없어요.',
        selection_required: '같은 이름의 커넥터가 여러 개예요. 하나를 고른 뒤 다시 눌러 주세요.',
        tool_error: '세션을 만들지 못했어요. ' + String(e && e.message || '').slice(0, 140)
      }[code] || '잠깐 연결이 안 됐어요. 잠시 후 다시 눌러 주세요.';
      banner('warn', '새로고침을 시작하지 못했어요', msg, false);
    }
  }
  $('#refreshBtn').addEventListener('click', requestRefresh);

  // ---- toast ----
  let toastT;
  function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1700); }

  // ---- first paint ----
  renderHeader(); renderHome(); renderJobs(); renderNewsChips(); renderNews();
  const lastTab = load('tab', 'home'); if (['home','jobs','news','saved'].includes(lastTab)) go(lastTab);

  // ---- capabilities light up later ----
  if (window.claude && typeof window.claude.use === 'function') {
    claude.use('sample').then(s => { if (s) { state.sample = s; $$('[data-explain]').forEach(x => x.hidden = false); } }).catch(() => {});
    claude.use('mcp').then(m => { if (m && CFG.envId && CFG.prompt) { state.mcp = m; syncRefreshUI(); } }).catch(() => {});
    claude.use('db').then(db => {
      if (!db) return;
      db.collection('news').orderBy('date', 'desc').limit(300).onSnapshot(snap => {
        if (snap.empty) return;
        const byId = new Map(state.news.map(n => [n.id, n]));
        snap.docs.forEach(d => { const b = d.data(); if (b && b.title) byId.set(d.id, Object.assign({ id: d.id }, b)); });
        state.news = Array.from(byId.values()); rerenderAll();
      }, () => {});
      db.doc('meta/latest').onSnapshot(snap => {
        if (!snap.exists) return; const m = snap.data(); if (!m || !m.headline) return;
        if ((m.updatedAt || '') >= (state.meta.updatedAt || '')) { state.meta = Object.assign({}, state.meta, m); rerenderAll(); }
      }, () => {});
      db.doc('meta/status').onSnapshot(snap => { state.status = snap.exists ? snap.data() : null; syncRefreshUI(); }, () => {});
    }).catch(() => {});
    setInterval(syncRefreshUI, 60 * 1000);
  }
})();
</script>

</body>
</html>
