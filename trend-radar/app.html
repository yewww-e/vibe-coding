<title>디자이너 트렌드 레이더</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a one-column iOS-style feed with a fixed bottom tab bar; content cards are flat, separated by hairlines, with a single accent reserved for state and actions. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#E9EDF3;
  --fg:#15191F; --fg-2:#4B5563; --fg-3:#8A94A6; --line:#DFE4EC;
  --accent:#1E3FD6; --accent-fg:#FFFFFF; --accent-soft:#E4E9FB;
  --up:#0F8A5F; --up-soft:#DDF3EA; --down:#C8372D; --down-soft:#FBE3E0; --hold:#8A6D00; --hold-soft:#FBF0C9;
  --font-body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --tab-h:58px; --radius:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1216; --surface:#181C22; --surface-2:#232932;
  --fg:#EEF1F5; --fg-2:#B3BBC8; --fg-3:#737D8C; --line:#2A313B;
  --accent:#7D95FF; --accent-fg:#0B1230; --accent-soft:#1F2740;
  --up:#4FD39D; --up-soft:#133127; --down:#FF7B70; --down-soft:#3A1C1A; --hold:#E6C45A; --hold-soft:#3A3114;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1216; --surface:#181C22; --surface-2:#232932;
  --fg:#EEF1F5; --fg-2:#B3BBC8; --fg-3:#737D8C; --line:#2A313B;
  --accent:#7D95FF; --accent-fg:#0B1230; --accent-soft:#1F2740;
  --up:#4FD39D; --up-soft:#133127; --down:#FF7B70; --down-soft:#3A1C1A; --hold:#E6C45A; --hold-soft:#3A3114;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--accent)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
p{margin:0}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}

.app{min-height:100%;padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 24px)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 0}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:14px 10px}
.topbar h1{font-size:19px;font-weight:700;letter-spacing:-.01em}
.topbar .date{color:var(--fg-3);font-size:12px}

.view{display:none}
.view.active{display:block}
.section{margin-top:22px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.section-head h2{font-size:16px;font-weight:700}
.section-head .meta{font-size:12px;color:var(--fg-3)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stack{display:grid;gap:10px}
.list{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.list > *{border-top:1px solid var(--line)}
.list > *:first-child{border-top:0}

.hero{background:var(--fg);color:var(--bg);border-radius:var(--radius);padding:18px 18px 16px}
.hero .eyebrow{color:color-mix(in srgb,var(--bg) 60%,transparent)}
.hero h2{font-size:21px;font-weight:700;margin-top:6px;letter-spacing:-.01em}
.hero ul{margin:12px 0 0;padding-left:18px;display:grid;gap:6px;font-size:14.5px;line-height:1.5}
.hero li::marker{color:color-mix(in srgb,var(--bg) 55%,transparent)}
.hero .foot{margin-top:12px;font-size:12px;color:color-mix(in srgb,var(--bg) 60%,transparent)}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.tile .k{font-size:11px;color:var(--fg-3)}
.tile .v{font-family:var(--font-mono);font-size:18px;font-weight:500;margin-top:2px}
.tile .v small{font-size:11px;color:var(--fg-3);margin-left:3px;font-family:var(--font-body)}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--fg-2);font-size:13px;padding:6px 12px;border-radius:999px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{padding:7px 10px;border-radius:8px;font-size:14px;font-weight:600;color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.news{padding:14px 16px;display:grid;gap:8px;background:var(--surface)}
.news .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.news .tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.04em;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--fg-2)}
.tag.ai{background:var(--accent-soft);color:var(--accent)}
.tag.kr{background:var(--hold-soft);color:var(--hold)}
.news .date{font-family:var(--font-mono);font-size:11px;color:var(--fg-3)}
.news h3{font-size:15.5px;font-weight:600;letter-spacing:-.005em}
.news .sum{font-size:14px;color:var(--fg-2)}
.news .why{font-size:13.5px;padding:8px 10px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;color:var(--fg)}
.news .why b{font-weight:600}
.news .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:7px 12px;border-radius:9px;background:var(--surface-2);color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;color:var(--accent);padding-left:4px;padding-right:4px}
.btn[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.btn:disabled{opacity:.55;cursor:default}
.explain{font-size:14px;line-height:1.6;background:var(--surface-2);border-radius:10px;padding:10px 12px;white-space:pre-wrap}
.explain[hidden]{display:none}
.explain .lbl{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;color:var(--fg-3);display:block;margin-bottom:4px}

.jd{display:grid;gap:10px}
.jd summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font-weight:600}
.jd summary::-webkit-details-marker{display:none}
.jd summary::after{content:"펼치기";font-size:12px;color:var(--accent);font-weight:500}
.jd[open] summary::after{content:"접기"}
.jd .kv{display:grid;grid-template-columns:72px 1fr;gap:6px 10px;font-size:13.5px;margin-top:10px}
.jd .kv dt{color:var(--fg-3);font-size:12px;padding-top:2px}
.jd .kv dd{margin:0;min-width:0}
.jd .kv ul{margin:0;padding-left:16px;display:grid;gap:3px}

.role{padding:13px 16px;display:grid;gap:6px;background:var(--surface)}
.role .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.role h3{font-size:15px;font-weight:600}
.role .dir{font-family:var(--font-mono);font-size:11px;padding:3px 8px;border-radius:6px;white-space:nowrap}
.dir.up{background:var(--up-soft);color:var(--up)}
.dir.down{background:var(--down-soft);color:var(--down)}
.dir.hold{background:var(--hold-soft);color:var(--hold)}
.role p{font-size:13.5px;color:var(--fg-2)}
.role .fit{font-size:12.5px;color:var(--fg-3)}
.role .fit b{color:var(--fg-2);font-weight:600}
.role .src{display:flex;gap:10px;flex-wrap:wrap;font-size:12px}

.country{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}

.posting{padding:12px 16px;display:grid;gap:3px;background:var(--surface)}
.posting .co{font-family:var(--font-mono);font-size:11px;color:var(--fg-3)}
.posting .t{font-weight:600;font-size:14.5px}
.posting .d{font-size:13px;color:var(--fg-2)}
.posting a{font-size:12.5px}

.skills{display:grid;gap:8px}
.skill{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.skill .n{font-weight:600;font-size:14px}
.skill .d{font-size:13px;color:var(--fg-2)}
.bar{height:6px;border-radius:3px;background:var(--surface-2);width:88px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.skill .pct{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);text-align:right}

.empty{padding:28px 16px;text-align:center;color:var(--fg-3);font-size:14px}
.note{font-size:12.5px;color:var(--fg-3);margin-top:10px;line-height:1.5}
.note a{color:var(--fg-2)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);border-top:1px solid var(--line);padding:0 max(8px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-right,0px))}
.tabbar .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tab-h)}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--fg-3);font-size:10.5px;font-weight:500}
.tabbar button[aria-selected="true"]{color:var(--accent)}
.tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar .badge{position:absolute;margin-left:22px;margin-top:-26px;background:var(--down);color:#fff;font-family:var(--font-mono);font-size:9.5px;padding:1px 5px;border-radius:999px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 14px);background:var(--fg);color:var(--bg);font-size:13px;padding:9px 14px;border-radius:999px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media (min-width:700px){.tiles{gap:10px}.news h3{font-size:16px}}
</style>

<div class="app">
  <header class="topbar"><div class="wrap">
    <h1>디자이너 트렌드 레이더</h1>
    <span class="date mono" id="hdrDate"></span>
  </div></header>

  <main class="wrap">
    <!-- 홈 -->
    <section class="view active" id="view-home" data-view="home">
      <div class="hero" id="hero"></div>
      <div class="section">
        <div class="tiles" id="tiles"></div>
      </div>
      <div class="section">
        <div class="section-head"><h2>직무 트렌드 한눈에</h2><button class="btn ghost" data-go="jobs">자세히</button></div>
        <div class="list" id="homeJobs"></div>
      </div>
      <div class="section">
        <div class="section-head"><h2>이번 주 꼭 볼 이슈</h2><button class="btn ghost" data-go="news">전체 보기</button></div>
        <div class="list" id="homeNews"></div>
      </div>
      <p class="note" id="homeNote"></p>
    </section>

    <!-- 직무 트렌드 -->
    <section class="view" id="view-jobs" data-view="jobs">
      <div class="seg" role="tablist" aria-label="지역">
        <button role="tab" data-region="kr" aria-pressed="true">국내</button>
        <button role="tab" data-region="global" aria-pressed="false">해외</button>
      </div>
      <div id="jobsKr">
        <details class="card jd" id="jdCard" open></details>
        <div class="section">
          <div class="section-head"><h2>늘어나는 직무</h2><span class="meta">NHN JD 대비 적합도</span></div>
          <div class="list" id="krUp"></div>
        </div>
        <div class="section">
          <div class="section-head"><h2>줄어들거나 합쳐지는 직무</h2></div>
          <div class="list" id="krDown"></div>
        </div>
        <div class="section">
          <div class="section-head"><h2>실제 공고 예시</h2><span class="meta">2025–2026</span></div>
          <div class="list" id="krPostings"></div>
        </div>
      </div>
      <div id="jobsGlobal" hidden>
        <div class="country chips" id="countryChips"></div>
        <div id="globalBody"></div>
      </div>
      <div class="section">
        <div class="section-head"><h2>JD에서 요구하는 스킬 변화</h2><span class="meta" id="skillMeta"></span></div>
        <div class="skills" id="skills"></div>
      </div>
      <p class="note" id="jobsNote"></p>
    </section>

    <!-- 테크/AI 이슈 -->
    <section class="view" id="view-news" data-view="news">
      <div class="chips" id="newsChips"></div>
      <div class="section" style="margin-top:12px">
        <div class="list" id="newsList"></div>
      </div>
      <p class="note">영어 원문은 링크로 연결됩니다. 「쉽게 설명」을 누르면 이 항목의 내용만 바탕으로 Claude가 더 풀어서 설명해 줍니다. 처음 한 번은 허용 확인이 뜹니다.</p>
    </section>

    <!-- 저장됨 -->
    <section class="view" id="view-saved" data-view="saved">
      <div class="section" style="margin-top:4px">
        <div class="section-head"><h2>저장한 항목</h2><span class="meta" id="savedMeta"></span></div>
        <div class="list" id="savedList"></div>
      </div>
      <p class="note">저장 목록은 이 기기의 브라우저에만 남습니다.</p>
    </section>
  </main>

  <nav class="tabbar" aria-label="주요 메뉴"><div class="in">
    <button data-tab="home" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/></svg>홈</button>
    <button data-tab="jobs" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18"/></svg>직무</button>
    <button data-tab="news" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 5h13v14H6a2 2 0 0 1-2-2z"/><path d="M17 9h3v8a2 2 0 0 1-2 2"/><path d="M7 9h7M7 12h7M7 15h4"/></svg>이슈</button>
    <button data-tab="saved" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></svg>저장</button>
  </div></nav>
  <div class="toast" id="toast" role="status"></div>
</div>

<script id="seed" type="application/json">__SEED__</script>
<script>
(function(){
  const SEED = JSON.parse(document.getElementById('seed').textContent);
  const $ = (s, r=document) => r.querySelector(s);
  const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const host = u => { try { return new URL(u).hostname.replace(/^www\./,''); } catch { return ''; } };

  // ---- state ----
  const state = {
    tab: 'home', region: 'kr', country: 'us', filter: 'all',
    news: SEED.news.slice(), jobs: SEED.jobs, meta: SEED.meta,
    saved: load('saved', []), read: load('read', []), sample: null, dbLive: false
  };
  function load(k, d){ try { const v = localStorage.getItem('tr.'+k); return v ? JSON.parse(v) : d; } catch { return d; } }
  function save(k, v){ try { localStorage.setItem('tr.'+k, JSON.stringify(v)); } catch {} }

  const TAGS = SEED.tags; // {key:label}
  const COUNTRIES = SEED.jobs.global.countries; // [{key,label}]

  // ---- header ----
  const today = new Date(state.meta.updatedAt);
  $('#hdrDate').textContent = today.toISOString().slice(0,10).replace(/-/g,'.') + ' 업데이트';

  // ---- navigation ----
  function go(tab){
    state.tab = tab;
    $$('.view').forEach(v => v.classList.toggle('active', v.dataset.view === tab));
    $$('.tabbar button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
    window.scrollTo({top:0});
    save('tab', tab);
    if (tab === 'saved') renderSaved();
  }
  $$('.tabbar button').forEach(b => b.addEventListener('click', () => go(b.dataset.tab)));
  $$('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));

  // ---- home ----
  function fmtDate(d){ return d ? d.slice(5).replace('-', '.') : ''; }
  function newsSorted(){ return state.news.slice().sort((a,b) => (b.date||'').localeCompare(a.date||'')); }

  function renderHome(){
    const m = state.meta;
    $('#hero').innerHTML = `
      <span class="eyebrow">주간 브리핑 · ${esc(m.week)}</span>
      <h2>${esc(m.headline)}</h2>
      <ul>${m.briefing.map(b => `<li>${esc(b)}</li>`).join('')}</ul>
      <p class="foot">${esc(m.footnote)}</p>`;
    const t = m.tiles;
    $('#tiles').innerHTML = t.map(x => `<div class="tile"><div class="k">${esc(x.k)}</div><div class="v">${esc(x.v)}<small>${esc(x.u||'')}</small></div></div>`).join('');
    const kr = state.jobs.kr;
    const picks = kr.up.slice(0,2).concat(kr.down.slice(0,1));
    $('#homeJobs').innerHTML = picks.map(roleHTML).join('');
    const top = newsSorted().filter(n => n.pick).slice(0,4);
    $('#homeNews').innerHTML = top.map(newsHTML).join('') || '<div class="empty">아직 이슈가 없습니다.</div>';
    $('#homeNote').textContent = m.sourceNote;
  }

  // ---- jobs ----
  function roleHTML(r){
    const dir = r.dir === 'up' ? '늘어남' : r.dir === 'down' ? '줄어듦' : '유지·변형';
    const srcs = (r.sources||[]).map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label||host(s.url))}</a>`).join('');
    return `<div class="role">
      <div class="row"><h3>${esc(r.title)}</h3><span class="dir ${esc(r.dir)}">${dir}${r.delta ? ' ' + esc(r.delta) : ''}</span></div>
      <p>${esc(r.desc)}</p>
      ${r.fit ? `<div class="fit"><b>NHN JD 적합도 ${esc(r.fit)}</b> · ${esc(r.fitWhy||'')}</div>` : ''}
      ${srcs ? `<div class="src">${srcs}</div>` : ''}
    </div>`;
  }
  function postingHTML(p){
    return `<div class="posting">
      <span class="co">${esc(p.company)} · ${esc(p.when||'')}</span>
      <span class="t">${esc(p.title)}</span>
      <span class="d">${esc(p.desc)}</span>
      ${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">공고 보기 ↗</a>` : ''}
    </div>`;
  }
  function renderJobs(){
    const kr = state.jobs.kr;
    const jd = kr.jd;
    $('#jdCard').innerHTML = `
      <summary><span>기준점 · ${esc(jd.title)}</span></summary>
      <p class="note" style="margin-top:6px">${esc(jd.note)}</p>
      <dl class="kv">
        <dt>직무명</dt><dd>${esc(jd.roleName)}</dd>
        <dt>주요 업무</dt><dd><ul>${jd.duties.map(d => `<li>${esc(d)}</li>`).join('')}</ul></dd>
        <dt>자격 요건</dt><dd><ul>${jd.requirements.map(d => `<li>${esc(d)}</li>`).join('')}</ul></dd>
        <dt>우대 사항</dt><dd><ul>${jd.preferred.map(d => `<li>${esc(d)}</li>`).join('')}</ul></dd>
        <dt>출처</dt><dd>${jd.sources.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`).join(' · ')}</dd>
      </dl>`;
    $('#krUp').innerHTML = kr.up.map(roleHTML).join('');
    $('#krDown').innerHTML = kr.down.map(roleHTML).join('');
    $('#krPostings').innerHTML = kr.postings.map(postingHTML).join('');
    $('#countryChips').innerHTML = COUNTRIES.map(c => `<button class="chip" data-country="${esc(c.key)}" aria-pressed="${String(c.key===state.country)}">${esc(c.label)}</button>`).join('');
    $$('#countryChips .chip').forEach(b => b.addEventListener('click', () => { state.country = b.dataset.country; renderGlobal(); }));
    renderGlobal();
    const sk = state.jobs.skills;
    $('#skillMeta').textContent = sk.meta;
    $('#skills').innerHTML = sk.items.map(s => `<div class="skill">
      <div><div class="n">${esc(s.name)}</div><div class="d">${esc(s.desc)}</div></div>
      <div><div class="pct">${esc(s.label)}</div><div class="bar"><i style="width:${Math.max(4,Math.min(100,s.pct))}%"></i></div></div>
    </div>`).join('');
    $('#jobsNote').innerHTML = state.jobs.note;
  }
  function renderGlobal(){
    $$('#countryChips .chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.country === state.country)));
    const g = state.jobs.global.byCountry[state.country];
    if (!g) { $('#globalBody').innerHTML = '<div class="empty">데이터가 없습니다.</div>'; return; }
    $('#globalBody').innerHTML = `
      <div class="card"><span class="eyebrow">${esc(g.label)} · 수요 흐름</span>
        <p style="margin-top:6px;font-size:14.5px">${esc(g.summary)}</p>
        <div class="tiles" style="margin-top:12px">${(g.stats||[]).map(x => `<div class="tile"><div class="k">${esc(x.k)}</div><div class="v">${esc(x.v)}<small>${esc(x.u||'')}</small></div></div>`).join('')}</div>
        ${g.statSource ? `<p class="note">${g.statSource}</p>` : ''}
      </div>
      ${g.up && g.up.length ? `<div class="section"><div class="section-head"><h2>늘어나는 직무</h2></div><div class="list">${g.up.map(roleHTML).join('')}</div></div>` : ''}
      ${g.down && g.down.length ? `<div class="section"><div class="section-head"><h2>줄어들거나 합쳐지는 직무</h2></div><div class="list">${g.down.map(roleHTML).join('')}</div></div>` : ''}
      ${g.postings && g.postings.length ? `<div class="section"><div class="section-head"><h2>실제 공고 예시</h2></div><div class="list">${g.postings.map(postingHTML).join('')}</div></div>` : ''}`;
  }
  $$('.seg [data-region]').forEach(b => b.addEventListener('click', () => {
    state.region = b.dataset.region;
    $$('.seg [data-region]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    $('#jobsKr').hidden = state.region !== 'kr';
    $('#jobsGlobal').hidden = state.region !== 'global';
  }));

  // ---- news ----
  function newsHTML(n){
    const saved = state.saved.includes(n.id);
    return `<article class="news" data-id="${esc(n.id)}">
      <div class="row"><div class="tags">${(n.tags||[]).map(t => `<span class="tag ${t==='ai'?'ai':t==='kr'?'kr':''}">${esc(TAGS[t]||t)}</span>`).join('')}${n.rumor ? '<span class="tag">루머/예정</span>' : ''}</div><span class="date">${esc(fmtDate(n.date))}</span></div>
      <h3>${esc(n.title)}</h3>
      <p class="sum">${esc(n.summary)}</p>
      ${n.why ? `<p class="why"><b>디자이너에게</b> ${esc(n.why)}</p>` : ''}
      <div class="acts">
        ${n.url ? `<a class="btn ghost" href="${esc(n.url)}" target="_blank" rel="noopener">원문 ↗ <span class="mono" style="font-weight:400;color:var(--fg-3)">${esc(host(n.url))}</span></a>` : ''}
        <button class="btn" data-explain="${esc(n.id)}" hidden>쉽게 설명</button>
        <button class="btn" data-save="${esc(n.id)}" aria-pressed="${saved}">${saved ? '저장됨' : '저장'}</button>
      </div>
      <div class="explain" id="ex-${esc(n.id)}" hidden></div>
    </article>`;
  }
  function renderNewsChips(){
    const keys = ['all'].concat(Object.keys(TAGS));
    $('#newsChips').innerHTML = keys.map(k => `<button class="chip" data-filter="${k}" aria-pressed="${String(k===state.filter)}">${k==='all'?'전체':esc(TAGS[k])}</button>`).join('');
    $$('#newsChips .chip').forEach(b => b.addEventListener('click', () => { state.filter = b.dataset.filter; renderNewsChips(); renderNews(); }));
  }
  function renderNews(){
    const items = newsSorted().filter(n => state.filter === 'all' || (n.tags||[]).includes(state.filter));
    $('#newsList').innerHTML = items.map(newsHTML).join('') || '<div class="empty">이 분류에는 아직 항목이 없습니다.</div>';
    wireNews();
  }
  function renderSaved(){
    const items = newsSorted().filter(n => state.saved.includes(n.id));
    $('#savedMeta').textContent = items.length ? items.length + '개' : '';
    $('#savedList').innerHTML = items.map(newsHTML).join('') || '<div class="empty">이슈 카드의 「저장」을 누르면 여기에 모입니다.</div>';
    wireNews();
  }
  function wireNews(){
    $$('[data-save]').forEach(b => b.onclick = () => {
      const id = b.dataset.save; const i = state.saved.indexOf(id);
      if (i >= 0) state.saved.splice(i,1); else state.saved.push(id);
      save('saved', state.saved);
      $$(`[data-save="${CSS.escape(id)}"]`).forEach(x => { const on = state.saved.includes(id); x.setAttribute('aria-pressed', String(on)); x.textContent = on ? '저장됨' : '저장'; });
      toast(i >= 0 ? '저장을 해제했습니다' : '저장했습니다');
      if (state.tab === 'saved') renderSaved();
    });
    $$('[data-explain]').forEach(b => { b.hidden = !state.sample; b.onclick = () => explain(b.dataset.explain, b); });
  }

  // ---- Claude: plain-language explanation of one item (page data only) ----
  async function explain(id, btn){
    const n = state.news.find(x => x.id === id); if (!n || !state.sample) return;
    const box = document.getElementById('ex-' + id); box.hidden = false; btn.disabled = true;
    box.innerHTML = '<span class="lbl">CLAUDE</span>생각하는 중…';
    const prompt = `당신은 IT 기업 UX 디자이너의 동료입니다. 아래 뉴스 항목을, 개발 지식이 없는 UX 디자이너가 이해할 수 있도록 한국어로 쉽게 풀어 설명하세요. 아래 제공된 내용만 근거로 삼고, 모르는 사실은 지어내지 마세요. 형식: 1) 한 줄 요약 2) 용어 풀이(필요한 경우만, 최대 3개) 3) 내 업무에 미치는 영향 2문장 4) 지금 해볼 것 1가지. 전체 6~9문장, 마크다운 기호 없이 평문으로.\n\n제목: ${n.title}\n날짜: ${n.date}\n요약: ${n.summary}\n디자이너 관점: ${n.why||''}\n출처: ${n.url||''}`;
    try {
      const ctl = new AbortController();
      const { text } = await state.sample(prompt, { modelTier: 'quick', signal: ctl.signal, onText: ({text}) => { box.innerHTML = '<span class="lbl">CLAUDE</span>' + esc(text); } });
      box.innerHTML = '<span class="lbl">CLAUDE</span>' + esc(text);
    } catch (e) {
      const code = e && e.code;
      if (code === 'not_granted' || code === 'sampling_disabled' || code === 'not_declared' || code === 'capability_disabled') { state.sample = null; $$('[data-explain]').forEach(x => x.hidden = true); box.hidden = true; }
      else if (code === 'cancelled') box.hidden = true;
      else box.innerHTML = '<span class="lbl">CLAUDE</span>' + esc(e && e.text ? e.text : '') + (code === 'rate_limited' ? '\n지금은 요청이 많습니다. 잠시 후 다시 눌러 주세요.' : '\n설명을 가져오지 못했습니다. 다시 시도해 주세요.');
    } finally { btn.disabled = false; }
  }

  // ---- toast ----
  let toastT;
  function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1600); }

  // ---- first paint ----
  renderHome(); renderJobs(); renderNewsChips(); renderNews();
  const lastTab = load('tab', 'home'); if (['home','jobs','news','saved'].includes(lastTab)) go(lastTab);

  // ---- capabilities light up later ----
  if (window.claude && typeof window.claude.use === 'function') {
    claude.use('sample').then(s => { if (s) { state.sample = s; $$('[data-explain]').forEach(x => x.hidden = false); } }).catch(() => {});
    claude.use('db').then(db => {
      if (!db) return;
      db.collection('news').orderBy('date', 'desc').limit(300).onSnapshot(snap => {
        if (snap.empty) return;
        const byId = new Map(state.news.map(n => [n.id, n]));
        snap.docs.forEach(d => { const b = d.data(); if (b && b.title) byId.set(d.id, Object.assign({ id: d.id }, b)); });
        state.news = Array.from(byId.values());
        state.dbLive = true; renderHome(); renderNews(); if (state.tab === 'saved') renderSaved();
      }, () => {});
      db.doc('meta/latest').onSnapshot(snap => {
        if (!snap.exists) return;
        const m = snap.data(); if (!m || !m.headline) return;
        state.meta = Object.assign({}, state.meta, m);
        $('#hdrDate').textContent = String(state.meta.updatedAt).slice(0,10).replace(/-/g,'.') + ' 업데이트';
        renderHome();
      }, () => {});
    }).catch(() => {});
  }
})();
</script>
